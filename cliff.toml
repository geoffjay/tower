# git-cliff configuration (https://git-cliff.ai)
# Conventional commits → Keep a Changelog sections, grouped by type.
# `cargo make release -- --version x.y.z` regenerates CHANGELOG.md up to the
# new tag; the GitHub release keeps its auto-generated notes.

[changelog]
header = """
# Changelog

All notable changes to tower are documented here. Generated by
[git-cliff](https://git-cliff.ai) from conventional commits.
"""
body = """

{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}({{ commit.scope }}) {% endif %}\
{{ commit.message | upper_first | split(pat="\n") | first }}
{% endfor %}\
{% endfor %}
"""
footer = """

Full commit history: https://github.com/geoffjay/tower/commits/main
"""
trim = true
postprocessors = [{ pattern = " +\\n", replace_with = "\n" }]

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
merge_commits = false

commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore(\\(release\\))?: (release|bump version)", skip = true },
  { message = "^chore", group = "Chore" },
  { message = ".*", group = "Other" },
]